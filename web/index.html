<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIRO</title>
<style>
@font-face {
  font-family: Archivo; src: url(/static/archivo.woff2) format("woff2");
  font-weight: 300 800; font-stretch: 62% 125%; font-display: swap;
}
:root {
  --ink: #0d1422; --panel: #131c2d; --rule: #22304a; --text: #dde4ef; --dim: #7c8aa5; --faint: #4a5874;
  --belief: #8fb4ff; --reality: #ffb547; --alarm: #ff5f5f;
  --sans: Archivo, system-ui, sans-serif; font: 15px/1.45 var(--sans); font-variant-numeric: tabular-nums;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--ink); color: var(--text); }
body {
  display: grid; gap: 1px; background: var(--rule); height: 100vh;
  grid-template: "floor side" 1fr "spark cmd" 116px / 1fr minmax(360px, 30vw);
}
body > * { background: var(--ink); min-width: 0; min-height: 0; }
h2 { font-size: 13px; font-weight: 500; color: var(--dim); letter-spacing: .01em; }

#floor { grid-area: floor; display: grid; place-items: center; padding: 22px 26px; }
#frame { display: flex; flex-direction: column; gap: 16px; }
#stage { position: relative; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px var(--rule); transition: box-shadow .4s; }
#stage.alarm { box-shadow: 0 0 0 2px var(--alarm), 0 0 40px #ff5f5f40; }
#stage img, #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#stage img { filter: saturate(.6) brightness(.7) contrast(1.05); }
#brand { font: 750 22px var(--sans); font-stretch: 125%; letter-spacing: .02em; }
#brand small { display: block; font: 400 12px var(--sans); color: var(--dim); letter-spacing: 0; }
#legend { display: flex; gap: 18px; font-size: 12px; color: var(--dim); }
#legend i { display: inline-block; width: 18px; height: 0; margin-right: 6px; vertical-align: middle; border-top: 2px solid; }

#side { grid-area: side; display: grid; grid-template-rows: auto 1fr; gap: 1px; background: var(--rule); }
#side > * { background: var(--ink); min-height: 0; padding: 20px 22px; }
#body header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
#bodyn { font: 700 44px/1 var(--sans); font-stretch: 125%; letter-spacing: -.01em; transition: color .6s; }
#bodyn.fresh { color: var(--belief); text-shadow: 0 0 24px #8fb4ff80; }
#bodyname { color: var(--dim); margin-top: 6px; }
#relearned { text-align: right; font-size: 13px; color: var(--dim); }
#relearned b { display: block; font: 600 22px var(--sans); color: var(--text); }
.param { display: grid; grid-template-columns: 1fr auto; row-gap: 5px; padding: 9px 0; border-top: 1px solid var(--rule); }
.param span:nth-child(2) { text-align: right; }
.param .v { font-weight: 600; }
.param .k { color: var(--dim); font-size: 12px; }
.bar { grid-column: 1 / 3; position: relative; height: 6px; border-radius: 3px; background: #1d2840; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--belief); transition: width .5s; }
.bar .key { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); transition: left .5s; }
.legend-key { font-size: 12px; color: var(--faint); margin-top: 8px; }
.legend-key i { display: inline-block; width: 2px; height: 10px; background: var(--text); margin: 0 6px -1px 0; }

#notebook { display: flex; flex-direction: column; }
#entries { overflow-y: auto; margin-top: 10px; scrollbar-width: none; mask-image: linear-gradient(transparent, #000 24px); flex: 1; padding-top: 14px; }
.entry { display: grid; grid-template-columns: 24px 1fr auto; column-gap: 10px; padding: 9px 0; animation: arrive .5s ease-out; }
.entry svg { width: 18px; height: 18px; margin-top: 2px; }
.entry p { font-size: 14px; }
.entry b { font-weight: 600; margin-right: 6px; }
.entry time { font-size: 12px; color: var(--faint); padding-top: 2px; }
.entry.alert { color: var(--alarm); }
.entry.hypothesis svg, .entry.prediction svg { color: var(--belief); }
.entry.result svg { color: var(--reality); }
.entry.conclusion { background: #8fb4ff12; border-radius: 6px; margin: 4px -10px; padding: 10px; }
.entry.fallback { color: var(--dim); }
@keyframes arrive { from { opacity: 0; transform: translateY(8px); } }

#spark { grid-area: spark; display: grid; grid-template-columns: 150px 1fr; align-items: center; padding: 14px 22px 14px 26px; gap: 18px; }
#sval { font: 600 34px/1 var(--sans); font-stretch: 112%; margin-top: 6px; transition: color .3s; }
#sval.hot { color: var(--alarm); }
#sparkwrap { position: relative; height: 100%; }
#sparkline { position: absolute; inset: 0; width: 100%; height: 100%; }

#cmd { grid-area: cmd; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 14px 22px; }
#cmd form { display: flex; gap: 10px; align-items: center; }
#cmd input {
  flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--panel);
  border: 1px solid var(--rule); border-radius: 6px; padding: 9px 12px; outline: none;
}
#cmd input:focus-visible { border-color: var(--belief); }
#lastcmd { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#lastcmd q { color: var(--text); }
#status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 99px; background: var(--panel); font-size: 13px; font-weight: 500; white-space: nowrap; }
#status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--reality); }
#status.surprised { color: var(--alarm); } #status.surprised::before { background: var(--alarm); }
#status.relearning::before { background: var(--belief); animation: pulse 1s infinite alternate; }
#status.offline::before { background: var(--faint); }
@keyframes pulse { to { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<section id="floor"><div id="frame">
  <div id="brand">AIRO<small>Adaptive intelligence for robots</small></div>
  <div id="stage"><img id="video" src="/video" alt="Overhead floor view"><canvas id="overlay"></canvas></div>
  <div id="legend">
    <span><i style="border-color:#8fb4ff80"></i>Predicted paths</span>
    <span><i style="border-color:var(--text);border-top-style:dashed"></i>Planned path</span>
    <span><i style="border-color:var(--reality)"></i>Actual car</span>
  </div>
</div></section>
<aside id="side">
  <section id="body">
    <header>
      <div><div id="bodyn">Body</div><div id="bodyname"></div></div>
      <div id="relearned"></div>
    </header>
    <div id="params"></div>
    <div class="legend-key"><i></i>hand-measured value, never shown to the learner</div>
  </section>
  <section id="notebook"><h2>Lab notebook</h2><div id="entries"></div></section>
</aside>
<section id="spark">
  <div><h2>Surprise</h2><div id="sval">0.0</div></div>
  <div id="sparkwrap"><canvas id="sparkline"></canvas></div>
</section>
<section id="cmd">
  <form id="cmdform"><input id="cmdtext" placeholder="Tell AIRO what to do, like deliver to blue" autocomplete="off"><span id="status" class="offline">Connecting</span></form>
  <div id="lastcmd"></div>
</section>
<script src="/static/dash.js"></script>
</body>
</html>
