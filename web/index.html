<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIRO</title>
<link rel="stylesheet" href="/static/dash.css">
</head>
<body>
<img id="hero" src="/view" alt="Robot view">
<div id="shade"></div>
<div id="alarm"></div>

<main id="hud">
  <header id="top" class="panel">
    <div id="brand">AIRO <span id="mode" class="chip">Simulation</span></div>
    <div id="mission"><svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg><q id="command"></q></div>
    <div id="clockbox"><span id="status" class="chip">Connecting</span><time id="clock">0:00</time></div>
  </header>

  <section id="body" class="panel glass">
    <header>
      <div class="who"><img id="portrait" alt="" hidden><div><div id="bodyn"><span>Body</span></div><div id="bodyname"></div></div></div>
      <div id="relearned"></div>
    </header>
    <div id="params"></div>
    <footer><i class="tick key"></i>Hand-measured key <span id="prevkey" hidden><i class="tick prev"></i>Previous body</span></footer>
  </section>

  <section id="relearn" class="hidden">
    <ol id="steps"><li>Body changed</li><li>Testing</li><li>Relearned</li></ol>
    <div id="rdetail"></div>
  </section>

  <section id="log" class="panel glass">
    <header><h2>Lab notebook</h2><span id="expcount"></span></header>
    <div id="cards"></div>
  </section>

  <section id="map" class="panel glass">
    <header><h2>Floor map</h2><span id="floorsize"></span></header>
    <div id="mapbox"><div id="stage"><img id="video" src="/video" alt="Top-down floor"><canvas id="overlay"></canvas></div></div>
  </section>

  <section id="dock" class="panel">
    <div id="meter" class="glass">
      <div id="mread"><div id="sval">0.0</div><h2>Surprise</h2></div>
      <div id="sparkwrap"><canvas id="spark"></canvas></div>
    </div>
    <form id="cmdform" class="glass"><input id="cmdtext" placeholder="Tell AIRO what to do" autocomplete="off"><kbd>/</kbd></form>
  </section>

  <section id="timeline" class="panel glass"><div id="bands"></div><div id="now"></div></section>
</main>

<aside id="help" class="glass hidden">
  <h2>Shortcuts</h2>
  <dl><dt>H</dt><dd>Clean hero view</dd><dt>V</dt><dd>Swap 3D and floor map</dd><dt>B N M</dt><dd>Body, notebook, map</dd>
  <dt>S T</dt><dd>Surprise dock, timeline</dd><dt>F</dt><dd>Fullscreen</dd><dt>/</dt><dd>Type a command</dd></dl>
</aside>

<script src="/static/map.js"></script>
<script src="/static/dash.js"></script>
</body>
</html>
