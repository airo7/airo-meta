[project]
name = "airo"
version = "0.1.0"
description = "Adaptive Intelligence for Robots: a $50 robot that learns its own body"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2",
    "opencv-python>=4.10",
    "bleak>=1",
    "openai>=2",
    "meta-sam-parser>=0.1",
    "pillow>=11",
    "scipy>=1.18.1",
    "websockets>=17.3",
    "sounddevice>=0.5.6",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airo"]
